name: Verify staking infrastructure
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm run build
      - run: git diff --exit-code -- contracts/funded-rewards/client contracts/legacy/client
      - run: npm run check
      - run: npm test
      - run: npm run test:accounting
      - run: npm run check:edge
      - run: npm run test:edge
      - run: npm run check:public
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install algokit==2.10.2
      - run: algokit localnet start
      - run: npm run test:contracts
      - run: npm run demo:localnet
